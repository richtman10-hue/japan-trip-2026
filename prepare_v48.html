<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>הכנת V48 — יפן 2026</title><style>body{font-family:Arial,sans-serif;max-width:720px;margin:35px auto;padding:20px;line-height:1.7;background:#f6faf9;color:#173a35}button{background:#08796c;color:white;padding:12px 20px;border:0;border-radius:10px;font-size:17px;cursor:pointer;margin:6px}button:disabled{opacity:.5}pre{white-space:pre-wrap;direction:ltr;text-align:left;background:white;padding:14px;border:1px solid #ddd;border-radius:8px}input{display:block;margin:8px 0}</style><h1>הכנת עדכון V48</h1><p>הכלי מכין קובצי עדכון על בסיס V47 הקיימת ב-GitHub, ללא שינוי של קובצי ההזמנות או המסלול. הקבצים נוצרים במחשב שלך; שום דבר לא מועלה אוטומטית.</p><button id="run">הכן קובצי V48</button><p id="status"></p><div id="downloads"></div><details><summary>אם הורדת הקבצים מהמאגר חסומה</summary><p>הורד את <code>index.html</code> ואת <code>sw.js</code> מהמאגר, בחר אותם כאן ואז לחץ שוב על הכפתור.</p><label>index.html <input type="file" id="index" accept=".html"></label><label>sw.js <input type="file" id="sw" accept=".js"></label></details><pre id="log"></pre><script>
const ROOT='https://raw.githubusercontent.com/richtman10-hue/japan-trip-2026/main/';
const changes=[
['<body data-build="V47">','<body data-build="V48">'],
['גרסה V47 · תמיכה באופליין · מפת יפן 26 · הזמנות לפי קטגוריות','גרסה V48 · מפת יפן 26 · קישורים משופרים · אופליין'],
['if(!cfg)return `<div class="card" style="margin-top:12px;background:#f7fbff"><h3>🗺️ מפת היום</h3><p>המקומות ששמרת ברשימת יפן 26 ב-Google Maps.</p><div class="btns"><a class="btn primary" target="_blank" rel="noopener" href="${JAPAN_SAVED_MAP}">📌 פתח מפת יפן 26</a></div></div>`;','if(!cfg)return ``;'],
['<p>רשימת המקומות האישית שלך ב-Google Maps (יפן 26). המסלולים היומיים נפתחים בנפרד לניווט.</p><div class="btns"><a class="btn primary" target="_blank" rel="noopener" href="${JAPAN_SAVED_MAP}">📌 פתח את מפת יפן 26</a></div>${segments.map','<p>מסלולי היום נפתחים בנפרד לניווט. לרשימת המקומות האישית שלך השתמש בכפתור ״מפת יפן 26״ בתחתית.</p>${segments.map'],
['href="${maps(d.city)}">🧭 מפה כללית','href="${JAPAN_SAVED_MAP}" rel="noopener">🗺️ מפת יפן 26'],
['https://www.gotokyo.org/en/destinations/western-tokyo/shinjuku/index.html','https://www.google.com/maps/search/?api=1&query=Godzilla+Road+Kabukicho+Tokyo'],
['https://www.gotokyo.org/en/spot/74/','https://www.google.com/maps/search/?api=1&query=Omoide+Yokocho+Shinjuku+Tokyo']
];
function patchIndex(text){let counts=[];for(const [a,b] of changes){const n=text.split(a).length-1;if(!n)throw Error('לא נמצאה תבנית צפויה: '+a.slice(0,55));counts.push(n);text=text.split(a).join(b)}if(text.includes('data-build="V47"'))throw Error('סימון גרסה ישן');return {text,counts}}
function patchSW(text){if(!text.includes("japan-2026-v47-offline"))throw Error('גרסת sw.js אינה V47');return text.replaceAll('japan-2026-v47-offline','japan-2026-v48-offline')}
async function source(id,name){const f=document.getElementById(id).files[0];if(f)return await f.text();const r=await fetch(ROOT+name+'?v48='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('לא ניתן לקרוא '+name+': '+r.status);return await r.text()}
function link(name,text){const blob=new Blob([text],{type:name.endsWith('.html')?'text/html;charset=utf-8':'text/javascript;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.textContent='הורד '+name;a.style.cssText='display:inline-block;padding:10px;background:white;border:1px solid #08796c;border-radius:8px;margin:5px;color:#08796c';document.getElementById('downloads').append(a)}
document.getElementById('run').onclick=async()=>{const status=document.getElementById('status'),log=document.getElementById('log');document.getElementById('downloads').innerHTML='';status.textContent='מכין קבצים...';try{const [i,w]=await Promise.all([source('index','index.html'),source('sw','sw.js')]);const p=patchIndex(i),sw=patchSW(w);link('index.html',p.text);link('sw.js',sw);status.textContent='הקבצים מוכנים. הורד את שניהם והעלה אותם לשורש המאגר ב-GitHub.';log.textContent='הוחלו '+changes.length+' החלפות; מספר מופעים: '+p.counts.join(', ')+'\nעודכן מטמון האופליין מ-V47 ל-V48.\nקבצים אחרים לא שונו.'}catch(e){status.textContent='ההכנה נעצרה ללא יצירת קבצים.';log.textContent=String(e)}};
</script></html>
