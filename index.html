function getTripIndex(){

 if(now<start)return -1;if(now>end)return DAYS.length;

}
function dayStrip(){

}

function today(){

function speakJP(text){
 if(!('speechSynthesis' in window)){alert('הקראת טקסט אינה נתמכת בדפדפן הזה');return}
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=0.82;window.speechSynthesis.speak(u);
}
function lang(){
 return title('🗣️ יפנית','משפטים שימושיים עם הקראה','לחץ על 🔊 כדי לשמוע הגייה יפנית מהמכשיר.')+
 `<div class="card"><table><thead><tr><th>עברית</th><th>יפנית</th><th>תעתיק</th><th>שמע</th></tr></thead><tbody>${JAPANESE.map(j=>`<tr><td><b>${j[0]}</b></td><td style="font-size:18px">${j[1]}</td><td>${j[2]}</td><td><button class="btn" onclick='speakJP(${JSON.stringify(j[1])})'>🔊</button></td></tr>`).join('')}</tbody></table></div>`;
}
function web(){
 return title('🌐 המלצות','דברים שכדאי לזכור','שילוב של תכנון, המלצות רשת והחומרים שכבר אספנו.')+`<div class="grid">${RECS.map(r=>`<div class="card"><div class="muted">${r[0]} · ${r[2]}</div><h3>${r[1]}</h3><p>${r[3]}</p></div>`).join('')}</div>`;

function render(){

function fxIls(){const u=Number(document.getElementById('usd')?.value||0),r=Number(document.getElementById('ilsrate')?.value||0);const o=document.getElementById('ilsout');if(o)o.textContent='₪'+(u*r).toFixed(2)}
function fx(){const y=Number(document.getElementById('yen')?.value||0),r=Number(document.getElementById('rate')?.value||0);const o=document.getElementById('fxout');if(o)o.textContent='$'+(y*r).toFixed(2)}
function nearby(q){if(!navigator.geolocation){window.open(maps(q),'_blank');return} navigator.geolocation.getCurrentPosition(p=>window.open('https://www.google.com/maps/search/'+encodeURIComponent(q)+'/@'+p.coords.latitude+','+p.coords.longitude+',15z','_blank'),()=>window.open(maps(q),'_blank'))}
