 const u=ATTRACTION_SITES[name];
 return u?`<a href="${u}" target="_blank" rel="noopener" style="font-weight:800;text-decoration:underline;text-underline-offset:2px">${name}</a>`:name;
}
function linkifyPlanText(text){
 let parts=[{v:text,html:false}];
 const names=Object.keys(ATTRACTION_SITES).sort((a,b)=>b.length-a.length);
 for(const name of names){
   const next=[];
   for(const part of parts){
     if(part.html || !part.v.includes(name)){next.push(part);continue}
     const chunks=part.v.split(name);
     chunks.forEach((chunk,i)=>{if(chunk)next.push({v:chunk,html:false});if(i<chunks.length-1)next.push({v:attractionLink(name),html:true})});
   }
   parts=next;
 }
 return parts.map(x=>x.v).join('');
}
function explainPlan(p){
 let text=p;
 for(const [k,v] of Object.entries(DESCRIPTIONS)){if(p.includes(k)){text=p+' — '+v;break}}
 return linkifyPlanText(text);
}

function closeSearch(){document.getElementById('searchOverlay')?.classList.remove('open')}
function performSearch(q){
 if(!SEARCH_INDEX)SEARCH_INDEX=buildSearchIndex();
 const box=document.getElementById('globalSearchResults'); const nq=normalizeSearch(q);
 if(!nq){box.innerHTML='<div class="card"><p>הקלד מילה או שם מקום. החיפוש עובר על כל הימים, האטרקציות, ההמלצות, האוכל, ההזמנות וההכנות.</p></div>';return}
 const words=nq.split(' ').filter(Boolean);
 const res=SEARCH_INDEX.filter(x=>words.every(w=>x._search.includes(w))).slice(0,40);
 box.innerHTML=res.length?res.map(x=>`<div class="card searchResult" onclick="goSearch('${x.tab}',${Number.isInteger(x.day)?x.day:'null'},'${x.anchor||''}')"><div class="muted">${x.icon||'🔎'} ${x.tab==='today'?'היום שלי':x.tab==='attr'?'אטרקציות':x.tab==='reserv'?'הזמנות':x.tab==='food'?'אוכל':x.tab==='web'?'המלצות':x.tab==='prep'?'הכנות':'מידע'}</div><h3><a href="#" onclick="event.preventDefault();event.stopPropagation();goSearch('${x.tab}',${Number.isInteger(x.day)?x.day:'null'},'${x.anchor||''}')">${x.title}</a></h3><p>${x.detail}</p></div>`).join(''):'<div class="card"><h3>לא נמצאו תוצאות</h3><p>נסה מילה קצרה יותר או שם באנגלית/עברית.</p></div>';
}
function goSearch(targetTab,day,anchor){if(day!==null&&day!==undefined)selectedDay=day;closeSearch();switchTab(targetTab);if(anchor){setTimeout(()=>{const el=document.getElementById(anchor);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},100)}else{window.scrollTo({top:0,behavior:'smooth'})}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch()});


function organizeReservations(){
 const children=Array.from(app.children);
 const headings=children.filter(el=>el.tagName==='H3');
 if(headings.length<4)return;
 const groups=[];
 for(let i=0;i<headings.length;i++){
   const head=headings[i], next=headings[i+1];
   const nodes=[];let n=head.nextElementSibling;
   while(n&&n!==next){const nxt=n.nextElementSibling;nodes.push(n);n=nxt;}
   groups.push({head,nodes});
 }
 const holder=document.createElement('div');holder.className='bookingGroups';
 const add=(label,nodes,opened=false)=>{
   const details=document.createElement('details');details.className='card bookingGroup';
   details.open=opened;
   const sum=document.createElement('summary');sum.textContent=label;details.append(sum);
   nodes.forEach(n=>details.append(n));holder.append(details);
 };
 const hotel=groups.find(g=>g.head.textContent.includes('מלונות'));
 const entry=groups.find(g=>g.head.textContent.includes('כניסה'));
 const shared=groups.find(g=>g.head.textContent.includes('משותפות'));
 const flights=groups.find(g=>g.head.textContent.includes('טיסות'));
 if(hotel)add('🏨 מלונות',hotel.nodes);
 if(flights)add('✈️ טיסות',flights.nodes.filter(n=>!n.classList.contains('grid')));
 if(shared){
   const grid=shared.nodes.find(n=>n.classList.contains('grid'));
   const cards=grid?Array.from(grid.children):[];
   const car=cards.find(n=>n.id==='car-booking');
   const train=cards.find(n=>n.textContent.includes('שינקנסן'));
   if(car)add('🚗 רכב שכור',[car]);
   if(train)add('🚄 רכבות ותחבורה',[train]);
   const others=cards.filter(n=>n!==car&&n!==train);
   if(others.length)add('📁 הזמנות נוספות',others);
 }
 if(entry)add('🛂 אישורי כניסה למדינות',entry.nodes);
 const misc=(flights&&flights.nodes.find(n=>n.classList.contains('grid')))||children.find(n=>n.classList.contains('grid')&&!groups.some(g=>g.nodes.includes(n)));
 if(misc){
   const cards=Array.from(misc.children);
   const transfers=cards.filter(n=>n.textContent.includes('הסעה מאושרת'));
   const guides=cards.filter(n=>!transfers.includes(n));
   if(transfers.length)add('🚘 הסעות מ/אל שדה התעופה',transfers);
   if(guides.length)add('👥 מדריכים ואחר',guides);
 }
 headings.forEach(n=>n.remove());
 app.append(holder);
}
function offlineStatus(){
 let badge=document.getElementById('offlineStatus');
 if(!badge){badge=document.createElement('div');badge.id='offlineStatus';badge.setAttribute('role','status');badge.style.cssText='position:fixed;top:6px;left:8px;z-index:60;background:#fff;border:1px solid #ddd;border-radius:999px;padding:4px 9px;font-size:11px;box-shadow:0 1px 6px #0002';document.body.append(badge)}
 badge.textContent=navigator.onLine?'🌐 מחובר · תוכן נשמר לאופליין':'📴 אופליין · מפות חיצוניות דורשות רשת';
}
window.addEventListener('online',offlineStatus);window.addEventListener('offline',offlineStatus);

"עיקרי"},{"city":"טוקיו","date":"7.11","name":"קבוקיצ׳ו ודרך גודזילה","text":"קבוקיצ׳ו פותח כרובע בילוי לאחר מלחמת העולם השנייה. דמות גודזילה, שנולדה בקולנוע היפני ב־1954, משקפת גם חרדות מהעידן הגרעיני; ראש גודזילה מעל מלון TOHO הוא מחווה מודרנית.","status":"עיקרי"},{"city":"טוקיו","date":"7.11","name":"אומואידה יוקוצ׳ו (Omoide Yokocho)","text":"סמטאות האוכל צמחו ליד תחנת שינג׳וקו לאחר מלחמת העולם השנייה, תחילה כדוכנים פשוטים. הן שומרות על תחושת טוקיו של תקופת השיקום.","status":"עיקרי"},{"city":"טוקיו","date":"7.11","name":"גולדן גאי (Golden Gai)","text":"רשת סמטאות זעירות ובהן ברים קטנים שהתפתחה אחרי מלחמת העולם השנייה. המקום נודע כמוקד של אמנים, סופרים ואנשי תרבות.","status":"חלופה"},{"city":"טוקיו","date":"7.11","name":"גן שינג׳וקו גיואן","text":"הגן התפתח מאחוזת משפחת נאיטו בתקופת אדו, ובהמשך היה גן קיסרי. לאחר מלחמת העולם השנייה נפתח לציבור ומשלב סגנונות גינון יפני, אנגלי וצרפתי.","status":"חלופה"},{"city":"אודווארה והאקונה","date":"8.11","name":"טירת אודווארה (Odawara Castle)","text":"הטירה הייתה מעוז מרכזי של שבט הוג׳ו במאה ה־16, עד שנכבשה בידי טויוטומי הידיושי ב־1590 במסגרת איחוד יפן. מגדל הטירה הנוכחי הוא שחזור מהמאה ה־20.","status":"עיקרי"},{"city":"אודווארה והאקונה","date":"8.11","name":"שדות עשב הכסף בסנגוקוהארה","text":"האזור הוא חלק מהנוף הגעשי של האקונה, ושדות העשב נשמרו באמצעות ניהול נוף מסורתי. בסתיו העשב המוכסף מדגיש את השילוב בין טבע לפעילות האדם.","status":"עיקרי"},{"city":"האקונה","date":"9.11","name":"האקונה ודרך טוקאידו","text":"האקונה הייתה תחנת מעבר חשובה על דרך טוקאידו, שחיברה בין אדו (טוקיו) לקיוטו בתקופת השוגונות. מעבר ההרים נודע גם כנקודת ביקורת על תנועת אנשים וסחורות.","status":"עיקרי"},{"city":"האקונה","date":"9.11","name":"תחנת הביקורת של האקונה ושדרת הארזים","text":"מחסום האקונה היה חלק ממערכת הפיקוח של שוגונות טוקוגאווה. שדרת הארזים נשתלה לאורך הדרך ההיסטורית כדי להגן על הנוסעים מפני מזג האוויר.","status":"עיקרי"},{"city":"האקונה","date":"9.11","name":"מקדש האקונה (Hakone Shrine)","text":"על פי המסורת נוסד המקדש במאה ה־8 ושימש מוקד פולחן להר ולכוחות הטבע. שער הטוריאי ליד אגם אשי נעשה אחד מסמליו המצולמים ביותר.","status":"חלופה"},{"city":"האקונה","date":"9.11","name":"אגם אשי והר הגעש אווקודאני","text":"אגם אשי נוצר במערכת הגעשית של האקונה לפני אלפי שנים. עמק אווקודאני הוא אזור פעילות גאותרמית שנוצר בעקבות התפרצות לפני כ־3,000 שנה בקירוב.","status":"עיקרי"},{"city":"פוג׳י ומאצומוטו","date":"10.11","name":"הר פוג׳י ואגם קוואגוצ׳יקו","text":"פוג׳י הוא הר געש וסמל דתי ואמנותי של יפן; במשך מאות שנים היה יעד לעלייה לרגל והונצח בהדפסי עץ. אזור האגמים התפתח גם כמוקד תיירות ונופש.","status":"עיקרי"},{"city":"מאצומוטו","date":"10.11","name":"טירת מאצומוטו","text":"המגדל המרכזי של הטירה נבנה בסוף המאה ה־16 ובראשית המאה ה־17, והוא אחד ממגדלי הטירה המקוריים שנותרו ביפן. כינויה ״טירת העורב״ קשור לצבעה הכהה.","status":"עיקרי"},{"city":"מאצומוטו","date":"10.11","name":"רחובות נאקמאצ׳י ונאוואטה","text":"נאקמאצ׳י ידוע במחסני סוחרים בעלי קירות לבנים ושחורים מתקופות מאוחרות של אדו ומייג׳י. נאוואטה משמר אופי של רחוב מסחר מקומי לאורך הנהר.","status":"עיקרי"},{"city":"אזומינו ועמק קיסו","date":"11.11","name":"חוות הוואסבי דאיו (Daio)","text":"החווה הוקמה ב־1915 ונעזרת במים קרים וצלולים הזורמים באזור אזומינו. היא ממחישה את התפתחות החקלאות המסחרית המודרנית לצד שיטות גידול מסורתיות.","status":"עיקרי"},{"city":"אזומינו ועמק קיסו","date":"11.11","name":"נראי־ג׳וקו (Narai-juku)","text":"נראי הייתה אחת מתחנות הלינה על דרך נאקאסנדו, שחיברה בין אדו לקיוטו בתקופת אדו. בתי העץ הארוכים משמרים את דמותה של עיירת מסע מן המאות ה־17–19.","status":"עיקרי"},{"city":"טאקיאמה","date":"12.11","name":"העיר העתיקה סאנמאצ׳י סוג׳י","text":"טאקיאמה התפתחה בתקופת אדו כעיר סוחרים ובעלי מלאכה, ונודעה בעבודות עץ איכותיות. הרחובות העתיקים משמרים חזיתות בתי עץ ומבשלות סאקה.","status":"עיקרי"},{"city":"טאקיאמה","date":"12.11","name":"שוק הבוקר מיאגאווה","text":"מסורת שוקי הבוקר בטאקיאמה התפתחה סביב מסחר של חקלאים מקומיים ותושבי האזור. השוק משקף את הקשר בין העיר לבין הכפרים ההרריים שסביבה.","status":"עיקרי"},{"city":"טאקיאמה","date":"12.11","name":"טאקיאמה ג׳יניה (Takayama Jinya)","text":"המבנה שימש מטה מנהלי של השלטון המרכזי בתקופת אדו, לאחר שהאזור הועבר לשליטה ישירה של השוגונות. זהו שריד נדיר של בניין ממשל מסוגו.","status":"עיקרי"},{"city":"טאקיאמה","date":"12.11","name":"מוזיאון עגלות הפסטיבל (Yatai Kaikan)","text":"העגלות המפוארות קשורות לפסטיבלי טאקאיאמה שהתפתחו בתקופת אדו. גילופי העץ והקישוטים משקפים את עושרם ואת כישוריהם של בעלי המלאכה המקומיים.","status":"חלופה"},{"city":"שירקאווה־גו","date":"13.11","name":"כפר שירקאווה־גו (Shirakawa-go)","text":"הכפר מפורסם בבתי גאשו־זוקורי בעלי גגות קש תלולים, המתאימים לשלג הכבד. המרחב הכפרי הוכרז אתר מורשת עולמית של אונסק״ו ב־1995.","status":"עיקרי"},{"city":"שירקאווה־גו","date":"13.11","name":"בית ואדה (Wada House)","text":"בית משפחת ואדה הוא דוגמה גדולה ושמורה לאדריכלות הגאשו־זוקורי של אזור שירקאווה. הביקור מאפשר להבין כיצד חיו ועבדו משפחות מורחבות בבתי העץ ההרריים.","status":"עיקרי"},{"city":"קאנאזאווה","date":"14.11","name":"גן קנרוקואן (Kenrokuen)","text":"הגן עוצב במשך דורות בידי שליטי שבט מאדה, ששלטו באזור קאגה בתקופת אדו. הוא נחשב לאחד משלושת הגנים הנופיים הידועים של יפן.","status":"עיקרי"},{"city":"קאנאזאווה","date":"14.11","name":"טירת קאנאזאווה","text":"הטירה שימשה את משפחת מאדה, אחת המשפחות הפיאודליות העשירות ביפן בתקופת אדו. מבנים רבים נפגעו בשרפות ושוחזרו בשיטות מסורתיות.","status":"עיקרי"},{"city":"קאנאזאווה","date":"14.11","name":"רובע הסמוראים נגאמאצ׳י","text":"הרובע היה אזור מגורים של סמוראים ששירתו את שליטי קאגה. סמטאותיו, קירות הטיט והבתים השמורים מספרים על הסדר החברתי של תקופת אדו.","status":"עיקרי"},{"city":"קאנאזאווה","date":"14.11","name":"שוק אומיצ׳ו (Omicho)","text":"השוק פועל באזור מאז ראשית המאה ה־18 ונחשב למרכז המזון של קאנאזאווה. הקרבה לים יפן השפיעה על תרבות הדגים ופירות הים המקומית.","status":"עיקרי"},{"city":"קאנאזאווה","date":"14.11","name":"רובע בתי התה היגאשי צ׳איה","text":"הרובע נוסד בראשית המאה ה־19 כחלק מהסדרת אזורי הבידור של קאנאזאווה. בתי העץ שמרו מסורות של מוזיקה, אירוח ואמנויות במה.","status":"עיקרי"},{"city":"פוקוי והיקונה","date":"15.11","name":"מצוקי טוג׳ינבו (Tōjinbō)","text":"המצוקים מורכבים מעמודי סלע שנוצרו מהתקררות מאגמה לפני מיליוני שנים. הם אינם אתר היסטורי במובן הצר, אך משקפים את הגאולוגיה יוצאת הדופן של חוף ים יפן.","status":"עיקרי"},{"city":"פוקוי והיקונה","date":"15.11","name":"טירת היקונה (Hikone)","text":"בניית הטירה הושלמה בראשית המאה ה־17, לאחר קרב סקיגהארה שביסס את שלטון טוקוגאווה. מגדל הטירה המקורי השתמר והוא אוצר לאומי של יפן.","status":"עיקרי"},{"city":"קיוטו","date":"16.11","name":"מקדש גינקאקו־ג׳י (Ginkaku-ji)","text":"המתחם נוסד בסוף המאה ה־15 כווילה של השוגון אשיקאגה יושימאסה והפך למקדש זן. למרות שמו ״ביתן הכסף״, המבנה לא צופה בכסף.","status":"עיקרי"},{"city":"קיוטו","date":"16.11","name":"מקדש קיומיזו־דרה","text":"ראשיתו של המקדש בסוף המאה ה־8. המרפסת הגדולה, שנבנתה מחדש בתקופת אדו, משקיפה על העיר והפכה לאחד מסמליה של קיוטו.","status":"עיקרי"},{"city":"קיוטו","date":"16.11","name":"סמטאות ניננזאקה וסאננזאקה","text":"הסמטאות מובילות למקדש קיומיזו־דרה ומשמרות נוף רחוב מסורתי של קיוטו. בתי העץ והחנויות משקפים את כלכלת עולי הרגל והמסחר המקומי.","status":"עיקרי"},{"city":"קיוטו","date":"16.11","name":"רובע גיון (Gion)","text":"גיון התפתח סביב מקדש יאסאקה כמרכז אירוח ובידור כבר בתקופת אדו. תרבות הגייקו והמאיקו המקומית משמרת אמנויות במה ואירוח יפניות.","status":"עיקרי"},{"city":"קיוטו","date":"16.11","name":"פושימי אינארי (Fushimi Inari)","text":"המקדש קשור לפולחן אינארי, אלוהות האורז והשגשוג, מאז שנת 711 לפי המסורת. אלפי שערי הטוריאי נתרמו בידי מאמינים ובעלי עסקים לאורך השנים.","status":"עיקרי"},{"city":"קיוטו","date":"17.11","name":"חורשת הבמבוק באראשיאמה","text":"אראשיאמה הייתה אזור נופש של אצילי קיוטו כבר בתקופת היאן. חורשת הבמבוק הפכה לאחד הנופים המזוהים עם מסורת הגנים והטבע של העיר.","status":"עיקרי"},{"city":"קיוטו","date":"17.11","name":"מקדש טנריו־ג׳י (Tenryū-ji)","text":"המקדש נוסד ב־1339 בידי השוגון אשיקאגה טקאוג׳י לזכר הקיסר גו־דאיגו. גן הנוף שלו נחשב דוגמה מרכזית לאמנות גני הזן.","status":"עיקרי"},{"city":"קיוטו","date":"17.11","name":"גשר טוגצוקיו (Togetsukyō)","text":"לפי המסורת, גשר התקיים במקום כבר בתקופת היאן, אך המבנה הנוכחי מודרני. השם ״הירח החוצה״ קשור לדימוי פיוטי של הירח מעל הנהר.","status":"עיקרי"},{"city":"קיוטו","date":"17.11","name":"רכבת סגאנו הרומנטית","text":"רכבת התיירים החלה לפעול ב־1991 על תוואי מסילה ישן לאורך נהר הוזו. היא ממחישה את הפיכת תשתיות התחבורה ההיסטוריות לחוויית נוף.","status":"חלופה"},{"city":"קיוטו","date":"17.11","name":"קינקאקו־ג׳י (ביתן הזהב)","text":"המבנה הוקם בסוף המאה ה־14 כווילה של השוגון אשיקאגה יושימיצו והפך למקדש זן. הביתן הנוכחי שוחזר ב־1955 לאחר שרפה.","status":"חלופה"},{"city":"קיוטו","date":"17.11","name":"ריואן־ג׳י (Ryōan-ji)","text":"מקדש הזן נוסד במאה ה־15 וידוע בגן אבנים מופשט, שנוצר כנראה בתקופה מאוחרת יותר. סידור האבנים מעודד התבוננות ופרשנות.","status":"חלופה"},{"city":"קיוטו","date":"18.11","name":"שוק נישיקי (Nishiki)","text":"השוק התפתח לאורך מאות שנים כמוקד למכירת דגים ומזון במרכז קיוטו. כיום הוא משלב מטבח מסורתי עם מסחר תיירותי.","status":"עיקרי"},{"city":"קיוטו","date":"18.11","name":"נאנזן־ג׳י (Nanzen-ji)","text":"המקדש נוסד בסוף המאה ה־13 והפך לאחד ממקדשי הזן החשובים ביפן. אמת המים מלבנים שנבנתה בסוף המאה ה־19 עוברת בשטחו וממחישה מודרניזציה.","status":"עיקרי"},{"city":"קיוטו","date":"18.11","name":"אייקנדו (Eikandō)","text":"ראשית המקדש במאה ה־9, והוא מזוהה עם מסורת הבודהיזם של הארץ הטהורה. שלכת הסתיו הפכה אותו למוקד עלייה לרגל ולביקור עונתי.","status":"עיקרי"},{"city":"קיוטו","date":"18.11","name":"מקדש טו־ג׳י (Tō-ji)","text":"המקדש נוסד בראשית המאה ה־9 עם הקמת הבירה היאן־קיו. הפגודה בת חמש הקומות, שנבנתה מחדש במאה ה־17, היא מסמלי קיוטו.","status":"חלופה"},{"city":"הירושימה","date":"19.11","name":"כיפת פצצת האטום (Atomic Bomb Dome)","text":"הבניין תוכנן בידי אדריכל צ׳כי והושלם ב־1915. שרידיו נשמרו לאחר הפצצה האטומית של 6 באוגוסט 1945, וכיום הם אתר מורשת עולמית וסמל לשלום.","status":"עיקרי"},{"city":"הירושימה","date":"19.11","name":"פארק השלום ומוזיאון הזיכרון","text":"הפארק הוקם באזור שנפגע קשות בפצצה האטומית, והמוזיאון נפתח ב־1955. הם מציגים את חיי התושבים, ההרס והשאיפה למניעת מלחמה גרעינית.","status":"עיקרי"},{"city":"הירושימה","date":"19.11","name":"מגדל אוריזורו (Orizuru Tower)","text":"המגדל הוא תוספת מודרנית למרחב ההנצחה של הירושימה. שמו מתייחס לעגור הנייר, שהפך לסמל של תקווה ושלום בעקבות סיפורה של סדאקו ססאקי.","status":"חלופה"},{"city":"מיאג׳ימה","date":"20.11","name":"מקדש איצוקושימה ושער הטוריאי","text":"המקדש קיבל את צורתו המפורסמת במאה ה־12 בחסות טאירה נו קיומורי. המבנים מעל קו המים והשער האדום יוצרים מראה משתנה עם הגאות והשפל.","status":"עיקרי"},{"city":"מיאג׳ימה","date":"20.11","name":"הר מיסן (Misen)","text":"הר מיסן נחשב אתר קדוש במסורת הבודהיסטית של האי; לפי המסורת קוקאי הגיע אליו במאה ה־9. שבילי היער ומקדשיו משלבים טבע ופולחן.","status":"חלופה"},{"city":"הירושימה","date":"20.11","name":"גן שוקקאין (Shukkeien)","text":"הגן נוסד ב־1620 עבור שליט הירושימה, בהשראת נופי אגמים והרים מוקטנים. הוא נפגע קשה ב־1945 ושוקם לאחר המלחמה.","status":"חלופה"},{"city":"אוסקה","date":"21.11","name":"דוטונבורי ונאמבה","text":"תעלת דוטונבורי נחפרה בראשית המאה ה־17, ולאורכה התפתחו תיאטראות, מסעדות ובתי בילוי. שלטי הניאון של המאה ה־20 ממשיכים את מסורת הבידור של האזור.","status":"עיקרי"},{"city":"אוסקה","date":"22.11","name":"טירת אוסקה","text":"הטירה הוקמה בסוף המאה ה־16 בידי טויוטומי הידיושי, מאחד יפן. היא נהרסה ונבנתה מחדש כמה פעמים; המגדל הנוכחי הוא שחזור בטון מ־1931.","status":"עיקרי"},{"city":"אוסקה","date":"22.11","name":"שוק קורומון (Kuromon)","text":"השוק התפתח במאה ה־19 ושימש מקור חשוב למוצרי מזון עבור מסעדות ותושבי אוסקה. הוא משקף את כינויה של העיר כמרכז קולינרי.","status":"עיקרי"},{"city":"אוסקה","date":"22.11","name":"רחוב דוגויאסוג׳י (Doguyasuji)","text":"רחוב המסחר התפתח במאה ה־20 כמרכז לחנויות ציוד למסעדות וכלי מטבח. הוא מדגים את הקשר בין תעשיות קטנות לבין תרבות האוכל של אוסקה.","status":"עיקרי"},{"city":"טוקיו","date":"5.11","name":"מוזיאון נזו והגן היפני","text":"מוזיאון לאמנות יפנית ומזרח־אסייתית באזור אומוטסנדו, לצד גן מסורתי. ביקור רק בתיאום עם המדריך ובמקום עצירה אחרת.","status":"חלופה"},{"city":"האקונה","date":"9.11","name":"מוזיאון האמנות הפתוח של האקונה","text":"מוזיאון פסלים בטבע בנוף הררי; מתאים כחלופה לחלק מהמסלול המעגלי, לא כתוספת ביום עמוס.","status":"חלופה"},{"city":"קאנאזאווה","date":"14.11","name":"בית הסמוראי נומורה","text":"בית משומר ברובע נגמאצ׳י, עם חדרים מסורתיים וגן קטן. אפשר להיכנס במהלך הסיור ברובע.","status":"חלופה"},{"city":"קאנאזאווה","date":"14.11","name":"וילת סייסונקאקו","text":"וילה היסטורית סמוכה לקנרוקואן, המדגימה את תרבות האצולה והעיצוב של קאנאזאווה.","status":"חלופה"},{"city":"קיוטו","date":"16.11","name":"סנג׳וסנגנדו (Sanjusangendo)","text":"אולם עץ מפורסם ובו 1,001 פסלי קאנון. אפשרות לסיור המודרך, בכפוף לתיאום ושינוי סדר עדיפויות.","status":"חלופה"},{"city":"קיוטו","date":"18.11","name":"טירת ניג׳ו","text":"מתחם ארמונות של השוגונות, עם מבנים וגנים היסטוריים; חלופה בלבד ליום עמוס.","status":"חלופה"},{"city":"הירושימה","date":"19.11","name":"גן שוקייאן (Shukkeien)","text":"גן נופי היסטורי שנוסד בשנת 1620 ונבנה מחדש לאחר מלחמת העולם השנייה; אפשרות רגועה בעיר.","status":"חלופה"},{"city":"אוסקה","date":"22.11","name":"בניין אומדה סקיי","text":"מגדל תצפית מודרני באזור אומדה; אפשרות אם נבחר Plan B של אומדה.","status":"חלופה"},{"city":"אוסקה","date":"23.11","name":"שינסאיבאשי־סוג׳י","text":"מדרחוב קניות מקורה בקרבת דוטונבורי; אפשרות לבילוי קצר ביום היציאה.","status":"חלופה"}];
function history(){
 const groups=[];
 HISTORICAL_SITES.forEach(e=>{const key=e.date+' · '+e.city;let g=groups.find(x=>x.key===key);if(!g){g={key,items:[]};groups.push(g)}g.items.push(e)});
 return `<div class="card"><h2>📜 מידע היסטורי</h2><p>רקע תמציתי לאתרים לפי ימי הטיול. ״חלופה״ מציין אתר שאינו חלק מחייב מהמסלול. כל המידע שמור בתוך האפליקציה וזמין גם ללא אינטרנט.</p></div>`+groups.map(g=>`<div class="card"><h3>${g.key}</h3>${g.items.map(e=>`<div class="row"><b>${e.name}${e.status==='חלופה'?' · 🟡 חלופה':''}</b><p>${e.text}</p></div>`).join('')}</div>`).join('');
}

const weatherEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wxDesc=c=>c===0?'בהיר':c<=3?'מעונן חלקית':c<=48?'ערפל':c<=67?'גשם':c<=77?'שלג':c<=82?'ממטרים':c<=86?'ממטרי שלג':'סופות רעמים';
function weatherAdvice(d,wx){
 const rain=wx.precipitation_probability_max>=55||wx.precipitation_sum>=4||wx.weather_code>=51&&wx.weather_code<=82;
 const wind=wx.wind_speed_10m_max>=35;
 const cold=wx.temperature_2m_min<=5;
 const snowy=wx.snowfall_sum>0||[71,73,75,77,85,86].includes(wx.weather_code);
 const out=[];
 if(rain)out.push('🌧️ סיכוי משמעותי לגשם: מעיל גשם קל, נעליים סגורות עמידות למים ומטרייה. שקלו לקצר גנים ותצפיות לטובת שווקים מקורים או מוזיאונים.');
 if(wind)out.push('💨 רוח חזקה: להימנע מהסתמכות על רכבלים, שיט או תצפיות חשופות; לבדוק הודעות מפעילים רשמיות.');
 if(cold||snowy)out.push('🧥 קור'+(snowy?' או שלג':'')+': שכבה תרמית, פליז/סוודר, מעיל חם וכובע; להיזהר מהחלקה בדרכים הרריות.');
 if(wx.temperature_2m_max>=20&&!rain)out.push('👕 ביום נעים יחסית: חולצה קלה עם שכבה נוספת לערב.');
 if(!out.length)out.push('🧥 לבוש בשכבות, נעליים נוחות ומעיל קל; אין כרגע אינדיקציה לשינוי משמעותי בפעילויות.');
 const txt=(d.plan||[]).join(' ');
 if(/Hakone|האקונה|Owakudani|רכבל|שיט/.test(txt)&&(wind||rain))out.push('🚡 האקונה: לשקול את מוזיאון הפסלים/אטרקציה מקורה כחלופה חלקית ללופ; בדקו בזמן אמת אם הרכבל והשיט פועלים.');
 if(/Misen|מיסן|מיאג׳ימה/.test(txt)&&(wind||rain))out.push('⛩️ מיאג׳ימה: לשמור על ביקור במקדש ולוותר על הר מיסן אם הראות או התנאים אינם מתאימים; לבדוק מעבורות.');
 if(/Kawaguchiko|קוואגוצ׳יקו|פוג׳י/.test(txt)&&(rain||wx.cloud_cover_mean>=75))out.push('🗻 ראות מוגבלת: לשקול לקצר עצירת פוג׳י ולהגיע מוקדם יותר למאצומוטו.');
 if(/Shirakawa|שירקאווה/.test(txt)&&(snowy||rain))out.push('🚗 שירקאווה־גו: בדקו תנאי כביש וחניה לפני היציאה; שקלו קיצור הביקור.');
 return out;
}

 `<div class="card"><h3>🔔 התראה ערב לפני</h3><p>אפשר להציג התראת הכנה כאשר האפליקציה פתוחה בערב. <b>התראת Push אוטומטית כשהאפליקציה סגורה דורשת שירות שליחה מתוזמן והרשאת התראות בטלפון</b> ואינה מופעלת בגרסה זו.</p><p class="muted">להתראה יזומה גם כשהאפליקציה סגורה יש להגדיר שירות Push חיצוני או תזכורת מתוזמנת. התחזית עצמה דורשת אינטרנט.</p><button class="btn" onclick="weatherReminder()">🔔 בדוק אפשרות התראה במכשיר</button><div id="weatherReminderStatus" class="muted"></div></div>`;
}
async function refreshWeather(){
 const box=document.getElementById('weatherResult');if(!box)return;
 const d=DAYS[weatherDayIndex],p=WEATHER_PLACES[d.date];
 if(!p){box.textContent='אין נקודת תחזית ליום הזה';return;}
 const today=new Date();today.setHours(0,0,0,0);
 const day=new Date(d.iso+'T12:00:00');const delta=Math.round((day-today)/86400000);
 if(delta<0||delta>15){box.innerHTML=`<p class="tips">📅 ${delta<0?'תאריך זה כבר חלף':'עדיין מוקדם לתחזית אמינה ליום הזה'}. בחרו יום בטווח התחזית הקרוב.</p>`;return;}
 box.textContent='בודק תחזית עדכנית...';
 try{
 const tz=d.date==='31.10'||d.date==='24.11'?'auto':d.date==='1.11'||d.date==='2.11'||d.date==='3.11'?'Asia/Seoul':'Asia/Tokyo';
 const url=`https://api.open-meteo.com/v1/forecast?latitude=${p[1]}&longitude=${p[2]}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,snowfall_sum,cloud_cover_mean&timezone=${encodeURIComponent(tz)}&forecast_days=16`;
 const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw Error('fetch');const json=await res.json();
 const i=json.daily?.time?.indexOf(d.iso);if(i<0)throw Error('date');
 const w=Object.fromEntries(Object.entries(json.daily).filter(([k,v])=>Array.isArray(v)).map(([k,v])=>[k,v[i]]));
 const advice=weatherAdvice(d,w);
 box.innerHTML=`<h3>${weatherEsc(p[0])} · ${d.date}</h3><p><b>${wxDesc(w.weather_code)}</b> · ${Math.round(w.temperature_2m_min)}°–${Math.round(w.temperature_2m_max)}°C</p><p>☔ הסתברות מרבית לגשם: ${w.precipitation_probability_max??'—'}% · כמות: ${w.precipitation_sum??'—'} מ״מ<br>💨 רוח מרבית: ${w.wind_speed_10m_max??'—'} קמ״ש</p><div class="tips"><b>המלצות לפעילויות ולביגוד</b>${advice.map(x=>`<p>${weatherEsc(x)}</p>`).join('')}</div><p class="muted">מקור: Open-Meteo · תחזית יומית לפי נקודת ייחוס אחת; ביום מעבר עשויים להיות תנאים שונים בדרך. עודכן: ${new Date().toLocaleString('he-IL')}. ההמלצות אינן משנות הזמנות או את המסלול.</p>`;
 }catch(e){box.innerHTML='<p class="tips">לא ניתן לטעון תחזית כעת. בדקו חיבור לאינטרנט ונסו שוב.</p>';}
}
