function attractionLink(name){
 const u=ATTRACTION_SITES[name];
 return u?`<a href="${u}" target="_blank" rel="noopener" style="font-weight:800;text-decoration:underline;text-underline-offset:2px">${name}</a>`:name;
}
function linkifyPlanText(text){
 let parts=[{v:text,html:false}];
 const names=Object.keys(ATTRACTION_SITES).sort((a,b)=>b.length-a.length);
 for(const name of names){
   const next=[];
   for(const part of parts){
     if(part.html || !part.v.includes(name)){next.push(part);continue}
     const chunks=part.v.split(name);
     chunks.forEach((chunk,i)=>{if(chunk)next.push({v:chunk,html:false});if(i<chunks.length-1)next.push({v:attractionLink(name),html:true})});
   }
   parts=next;
 }
 return parts.map(x=>x.v).join('');
}
function explainPlan(p){
 let text=p;
 for(const [k,v] of Object.entries(DESCRIPTIONS)){if(p.includes(k)){text=p+' — '+v;break}}
 return linkifyPlanText(text);
}

 'JINS Japan':'https://www.jins.com/jp/','Onitsuka Tiger Shinjuku':'https://www.onitsukatiger.com/jp/en/','MUJI Osaka':'https://www.muji.com/jp/','Don Quijote Japan':'https://www.donki.com/en/','Bic Camera Tokyo':'https://www.biccamera.com/bc/main/english/','Galaxy Harajuku Tokyo':'https://www.samsung.com/jp/explore/experience/galaxy-harajuku/','Santoku knife Japan':'https://www.japan.travel/en/guide/japanese-knives/'
};
function recLink(key,label){
 const site=ATTRACTION_SITES[key]||SHOPPING_LINKS[key];
 if(site)return `<a target="_blank" rel="noopener" href="${site}" style="text-decoration:underline;text-underline-offset:3px">${label}</a>`;
 return `<a target="_blank" rel="noopener" href="${hebInfo(label)}" style="text-decoration:underline;text-underline-offset:3px">${label}</a>`;
}
function planBRecommendations(){
 return Object.entries(EXTRA_ATTRACTIONS).map(([city,items])=>`<div class="card"><div class="muted">📍 ${city} · Plan B</div>${items.map(a=>`<div class="row"><b>${a[0]} ${recLink(a[1],a[1])} — ${a[2]}</b><div style="margin-top:4px;line-height:1.55">${a[3]}</div><div class="btns"><a class="btn" target="_blank" rel="noopener" href="${maps(a[4])}">🧭 מפה</a>${ATTRACTION_SITES[a[1]]?`<a class="btn" target="_blank" rel="noopener" href="${ATTRACTION_SITES[a[1]]}">🌐 מידע</a>`:''}</div></div>`).join('')}</div>`).join('');
}

function web(){
 return title('🌐 המלצות','דברים שכדאי לזכור','שילוב של תכנון, המלצות רשת, Plan B והחומרים שכבר אספנו. כל שם מקום לחיץ לקבלת מידע נוסף.')+`<h3 style="margin:18px 2px 10px">⭐ תזכורות והמלצות מרכזיות</h3><div class="grid">${RECOMMENDATION_REMINDERS.map((r,i)=>`<div class="card" id="recommendation-${i}"><div class="muted">${r[0]} ${r[1]}</div><h3>${recLink(r[4],r[2])}</h3><p>${r[3]}</p><div class="btns"><a class="btn" target="_blank" rel="noopener" href="${maps(r[2])}">🧭 מפה</a>${(ATTRACTION_SITES[r[4]]||SHOPPING_LINKS[r[4]])?`<a class="btn" target="_blank" rel="noopener" href="${ATTRACTION_SITES[r[4]]||SHOPPING_LINKS[r[4]]}">🌐 מידע</a>`:''}</div></div>`).join('')}</div><h3 style="margin:22px 2px 10px">🟡 כל אפשרויות Plan B לפי אזור</h3><div class="grid">${planBRecommendations()}</div>`;
}
function normalizeSearch(s){return String(s||'').toLowerCase().replace(/[״׳'".,:;()\[\]\/\\-]/g,' ').replace(/\s+/g,' ').trim()}
function buildSearchIndex(){
 const idx=[];
 DAYS.forEach((d,i)=>idx.push({title:`${d.date} · ${d.city}`,detail:[...d.plan,...d.tips,d.sleep].join(' · '),tab:'today',day:i,icon:d.icon||'☀️'}));
 ATTRACTIONS.forEach(a=>idx.push({title:a[2],detail:`${a[0]} · ${a[3]} · ${a[4]}`,tab:'attr',icon:a[1]||'🏯'}));
 Object.entries(EXTRA_ATTRACTIONS).forEach(([city,items])=>items.forEach(a=>idx.push({title:a[1],detail:`${city} · Plan B · ${a[2]} · ${a[3]}`,tab:'attr',icon:a[0]||'🟡'})));
 HOTEL_CONFIRMATIONS.forEach(h=>idx.push({title:h[1],detail:`מלון ${h[0]} · ${h[2]} · ${h[3]} · ${h[4]}`,tab:'reserv',icon:'🏨'}));
 FOODS.forEach(f=>idx.push({title:f[1],detail:`${f[0]} · ${f[2]} · ${f[3]}`,tab:'food',icon:'🍽️'}));
 Object.entries(FOOD_WISHLIST).forEach(([city,items])=>items.forEach(x=>idx.push({title:x[0],detail:`${city} · ${x[1]}`,tab:'food',icon:'🍴'})));
 RECOMMENDATION_REMINDERS.forEach((r,i)=>idx.push({title:r[2],detail:`${r[1]} · ${r[3]}`,tab:'web',anchor:`recommendation-${i}`,icon:r[0]}));
 [
  ['e-Arrival Card דרום קוריאה','72 שעות לפני ההגעה לסיאול · אשרת/טופס כניסה','prep','🛂'],
  ['Visit Japan Web','אישורי כניסה ליפן · בוצע','reserv','🛂'],
  ['ETC Card','לבקש בעת איסוף הרכב','prep','🚗'],
  ['רישיון נהיגה בינלאומי','בוצע','prep','✅'],
  ['JNTO Japan Travel','טיפים רשמיים ליפן: אינטרנט, כסף, מזוודות, נימוסים וחירום','prep','🇯🇵'],
  ['Toyota Rent a Car','רכב 8–15.11 · Haneda עד Kyoto','reserv','🚗'],
  ['הסעה מסיאול','ICN אל Aloft by Marriott Seoul Myeongdong','reserv','🚘'],
  ['הסעה באוסקה','Royal Park Osaka אל KIX · 23.11 18:55','reserv','🚘']
 ].forEach(x=>idx.push({title:x[0],detail:x[1],tab:x[2],icon:x[3]}));
 return idx.map(x=>({...x,_search:normalizeSearch(x.title+' '+x.detail)}));
}
let SEARCH_INDEX=null;
function openSearch(){const o=document.getElementById('searchOverlay');o.classList.add('open');const i=document.getElementById('globalSearchInput');setTimeout(()=>i.focus(),50);performSearch(i.value)}
function closeSearch(){document.getElementById('searchOverlay')?.classList.remove('open')}
function performSearch(q){
 if(!SEARCH_INDEX)SEARCH_INDEX=buildSearchIndex();
 const box=document.getElementById('globalSearchResults'); const nq=normalizeSearch(q);
 if(!nq){box.innerHTML='<div class="card"><p>הקלד מילה או שם מקום. החיפוש עובר על כל הימים, האטרקציות, ההמלצות, האוכל, ההזמנות וההכנות.</p></div>';return}
 const words=nq.split(' ').filter(Boolean);
 const res=SEARCH_INDEX.filter(x=>words.every(w=>x._search.includes(w))).slice(0,40);
 box.innerHTML=res.length?res.map(x=>`<div class="card searchResult" onclick="goSearch('${x.tab}',${Number.isInteger(x.day)?x.day:'null'},'${x.anchor||''}')"><div class="muted">${x.icon||'🔎'} ${x.tab==='today'?'היום שלי':x.tab==='attr'?'אטרקציות':x.tab==='reserv'?'הזמנות':x.tab==='food'?'אוכל':x.tab==='web'?'המלצות':x.tab==='prep'?'הכנות':'מידע'}</div><h3><a href="#" onclick="event.preventDefault();event.stopPropagation();goSearch('${x.tab}',${Number.isInteger(x.day)?x.day:'null'},'${x.anchor||''}')">${x.title}</a></h3><p>${x.detail}</p></div>`).join(''):'<div class="card"><h3>לא נמצאו תוצאות</h3><p>נסה מילה קצרה יותר או שם באנגלית/עברית.</p></div>';
}
function goSearch(targetTab,day,anchor){if(day!==null&&day!==undefined)selectedDay=day;closeSearch();switchTab(targetTab);if(anchor){setTimeout(()=>{const el=document.getElementById(anchor);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},100)}else{window.scrollTo({top:0,behavior:'smooth'})}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch()});

function render(){
 const f={home,today,plan,prep,attr,reserv:reservations,tools,food,near,lang,web}[tab]; app.innerHTML=f(); if(tab==='tools'){fx();fxIls();fxYenIls();fxIlsYen();fxKrw();} if(tab==='today'||tab==='plan')centerSelectedDay();
}

function fxYenIls(){const y=Number(document.getElementById('yenils')?.value||0),r=Number(document.getElementById('yenilsrate')?.value||0);const o=document.getElementById('yenilsout');if(o)o.textContent='₪'+(y*r).toFixed(2);fxIlsYen()}
function fxIlsYen(){const s=Number(document.getElementById('ilsyen')?.value||0),r=Number(document.getElementById('yenilsrate')?.value||0);const o=document.getElementById('ilsyenout');if(o)o.textContent=r>0?'≈ ¥'+Math.round(s/r).toLocaleString('en-US'):'—'}
async function refreshYenIls(){
 const meta=document.getElementById('yenilsmeta'); if(meta)meta.textContent='מרענן שער...';
 try{
  const res=await fetch('https://api.frankfurter.app/latest?from=JPY&to=ILS',{cache:'no-store'});
  if(!res.ok)throw new Error('rate');
  const data=await res.json(); const r=data?.rates?.ILS;
  if(!r)throw new Error('rate');
  const input=document.getElementById('yenilsrate'); if(input)input.value=Number(r).toFixed(6);
  fxYenIls();
  if(meta)meta.textContent=`שער עדכני מ-${data.date||'היום'} · מקור Frankfurter/ECB`;
 }catch(e){ if(meta)meta.textContent='לא ניתן לרענן כרגע. אפשר להשתמש בשער המוצג או לעדכן ידנית.'; }
}

function fxKrw(){const a=Number(document.getElementById('krwamount')?.value||0),ri=Number(document.getElementById('krwilsrate')?.value||0),ru=Number(document.getElementById('krwusdrate')?.value||0);const oi=document.getElementById('krwilsout'),ou=document.getElementById('krwusdout');if(oi)oi.textContent='≈ ₪'+(a*ri).toFixed(2);if(ou)ou.textContent='≈ $'+(a*ru).toFixed(2)}
async function refreshKrwRates(){const meta=document.getElementById('krwmeta');if(meta)meta.textContent='מרענן שערים...';try{const res=await fetch('https://api.frankfurter.app/latest?from=KRW&to=ILS,USD',{cache:'no-store'});if(!res.ok)throw new Error('rate');const data=await res.json();const ri=data?.rates?.ILS,ru=data?.rates?.USD;if(!ri||!ru)throw new Error('rate');const ii=document.getElementById('krwilsrate'),uu=document.getElementById('krwusdrate');if(ii)ii.value=Number(ri).toFixed(6);if(uu)uu.value=Number(ru).toFixed(6);fxKrw();if(meta)meta.textContent=`שער עדכני מ-${data.date||'היום'} · מקור Frankfurter/ECB`;}catch(e){if(meta)meta.textContent='לא ניתן לרענן כרגע; אפשר לעדכן את השערים ידנית.'}}
function fxIls(){const u=Number(document.getElementById('usd')?.value||0),r=Number(document.getElementById('ilsrate')?.value||0);const o=document.getElementById('ilsout');if(o)o.textContent='₪'+(u*r).toFixed(2)}
function fx(){const y=Number(document.getElementById('yen')?.value||0),r=Number(document.getElementById('rate')?.value||0);const o=document.getElementById('fxout');if(o)o.textContent='$'+(y*r).toFixed(2)}
function nearby(q){if(!navigator.geolocation){window.open(maps(q),'_blank');return} navigator.geolocation.getCurrentPosition(p=>window.open('https://www.google.com/maps/search/'+encodeURIComponent(q)+'/@'+p.coords.latitude+','+p.coords.longitude+',15z','_blank'),()=>window.open(maps(q),'_blank'))}
renderNav();render();


</script>

<script>
window.addEventListener('load', async () => {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const reg of regs) await reg.unregister();
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {}
});
</script>
