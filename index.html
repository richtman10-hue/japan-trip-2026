(async()=>{const HASH='5c9dbdf09f56bfd251b048c18d48303657881b7111322499af2813037c3a97a5',gate=document.getElementById('pinGate'),inp=document.getElementById('pinInput'),btn=document.getElementById('pinSubmit'),err=document.getElementById('pinError');if(sessionStorage.getItem('japan2026_auth')==='1')gate.style.display='none';async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')} async function go(){if(await sha(inp.value.trim())===HASH){sessionStorage.setItem('japan2026_auth','1');gate.style.display='none'}else{err.textContent='קוד שגוי';inp.select()}} btn.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()}})();
